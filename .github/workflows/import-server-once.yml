name: Import required server entrypoint

on:
  push:
    branches: [import-parkv3-clean]
    paths: [.github/workflows/import-server-once.yml]

permissions:
  contents: write

jobs:
  import-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-parkv3-clean
          fetch-depth: 0
      - run: git clone --depth 1 https://github.com/vdgnielsai-glitch/Parkv3.git /tmp/parkv3
      - name: Copy and commit server.ts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/parkv3/server.ts ./server.ts
          git config user.name "Shop Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore required server entrypoint"
          git push origin HEAD:import-parkv3-clean
