name: One-time Android icon repair

on:
  push:
    branches: [import-parkv3-clean]
    paths: [.github/workflows/tmp-icon-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-parkv3-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate launcher PNGs from canonical app icon
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open('public/app-icon-512.png').convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              d = Path(f'android/app/src/main/res/mipmap-{density}')
              d.mkdir(parents=True, exist_ok=True)
              base = src.resize((size,size), Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png']:
                  base.save(d/name, format='PNG', optimize=True)
          PY
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path('android/app/src/main/res').glob('mipmap-*/ic_launcher*.png'):
              Image.open(p).verify()
              print('OK', p)
          PY
      - name: Commit repaired icons
        run: |
          git config user.name "shopgo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/res/mipmap-*/ic_launcher*.png
          git diff --cached --quiet && exit 0
          git commit -m "android: regenerate valid launcher icons"
          git push origin HEAD:import-parkv3-clean
