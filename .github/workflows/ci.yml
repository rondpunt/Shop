name: ShopGo CI

on:
  push:
    branches: [main, import-parkv3-clean]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck app
        run: npx tsc --noEmit
      - name: Typecheck Vercel API
        run: npx tsc -p tsconfig.api.json --noEmit
      - name: Build installable PWA
        run: npm run build:pwa
