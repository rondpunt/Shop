name: One-time dependency hardening

on:
  push:
    branches: [import-parkv3-clean]
    paths: [.github/workflows/tmp-dependency-hardening.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-parkv3-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable production dependency graph
        run: |
          npm ci --no-audit --no-fund
          npm install --save-dev @capacitor/cli@^8.3.1 @capacitor/android@^8.3.1 @capacitor/ios@^8.3.1
          npm install --save-exact react-router-dom@6.30.4
          npm audit fix
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile-safe security updates
        run: |
          git config user.name "shopgo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "security: update vulnerable npm dependencies"
          git push origin HEAD:import-parkv3-clean
