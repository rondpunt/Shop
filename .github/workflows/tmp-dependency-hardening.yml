name: One-time dependency hardening

on:
  push:
    branches: [import-parkv3-clean]
    paths: [.github/workflows/tmp-dependency-hardening.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-parkv3-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable dependency graph without forcing majors
        run: |
          npm ci --no-audit --no-fund
          npm install --save-exact @capacitor/core@8.4.2
          npm install --save-dev --save-exact @capacitor/cli@8.4.2 @capacitor/android@8.4.2 @capacitor/ios@8.4.2
          npm install --save-exact react-router-dom@6.30.4
          npm audit fix || true
          npm audit --omit=dev --audit-level=high
      - name: Commit and rebase lockfile-safe security updates
        run: |
          git config user.name "shopgo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "security: update vulnerable npm dependencies"
          git pull --rebase origin import-parkv3-clean
          git push origin HEAD:import-parkv3-clean
