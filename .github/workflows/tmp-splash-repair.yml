name: One-time Android splash repair

on:
  push:
    branches: [import-parkv3-clean]
    paths: [.github/workflows/tmp-splash-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-parkv3-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate all splash PNG resources
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon = Image.open('public/app-icon-512.png').convert('RGBA')
          background = (249,247,244,255)
          files = list(Path('android/app/src/main/res').glob('drawable*/splash.png'))
          if not files:
              raise SystemExit('No splash resources found')
          for path in files:
              folder = path.parent.name
              if 'land' in folder:
                  w,h = 1920,1080
              elif 'port' in folder:
                  w,h = 1080,1920
              else:
                  w,h = 1080,1080
              canvas = Image.new('RGBA',(w,h),background)
              target = max(180, min(w,h)//3)
              mark = icon.resize((target,target),Image.Resampling.LANCZOS)
              canvas.alpha_composite(mark,((w-target)//2,(h-target)//2))
              canvas.convert('RGB').save(path,'PNG',optimize=True)
              Image.open(path).verify()
              print('OK',path,w,h)
          PY
      - name: Commit repaired splash assets
        run: |
          git config user.name "shopgo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/res/drawable*/splash.png
          git diff --cached --quiet && exit 0
          git commit -m "android: regenerate valid splash assets"
          git push origin HEAD:import-parkv3-clean
